services:
  postgres:
    image: postgres:16
    container_name: blindvault_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: blindvault
      POSTGRES_PASSWORD: blindvault
      POSTGRES_DB: blindvault
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  postgres_data:
